services:
  postgres-db:
    image: pgvector/pgvector:pg15
    container_name: pepebot_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:?isi DB_DATABASE di .env}
      POSTGRES_USER: ${DB_USERNAME:?isi DB_USERNAME di .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-service:
    build:
      context: ./core-service
    container_name: pepebot_core
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - ./core-service:/app
    environment:
      - DB_HOST=postgres-db
      - AI_SERVICE_URL=http://ai-service:8001
    depends_on:
      postgres-db:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
    container_name: pepebot_ai
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ./ai-service/.env
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres-db:5432/${DB_DATABASE}
    volumes:
      - ./ai-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata: